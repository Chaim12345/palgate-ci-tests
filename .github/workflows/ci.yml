name: palgate-ci
on:
  push:
    # Full emulator + DHU run only when app/projection-relevant files change.
    # Synthetic fixture (assets/) and CI-script-only updates are covered by
    # the fast fixtures-kat workflow instead.
    paths:
      - 'src/**'
      - 'res/**'
      - 'widgethost/**'
      - 'AndroidManifest.xml'
      - 'build.sh'
      - 'ci/aa_test.sh'
      - 'ci/aare_test.sh'
      - 'ci/palgate_render.sh'
      - 'ci/encoder_probe.sh'
      - 'encoderprobe/**'
      - 'ci/synthetic_whitelist.txt'
      - 'fetch_deps.py'
      - '.github/workflows/ci.yml'
      # Probe-only changes must not retrigger the whole pipeline (negative
      # pattern: GitHub forbids paths + paths-ignore together).
      - '!.github/workflows/redroid-probe.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Preflight secret scan (synthetic whitelist)
        run: python3 ci/scan_secrets.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK components
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" "emulator" "extras;google;auto"
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc++1 libc++abi1 xvfb

      - name: Fetch androidx deps and build APK
        env:
          ECJ_JAR: ${{ github.workspace }}/tools/ecj.jar
          TEST_BUILD: '1'
        run: |
          python3 fetch_deps.py
          python3 extract_cp.py
          ./build.sh

      - name: Upload built APK (TEST BUILD - actuation disabled, never for production delivery)
        uses: actions/upload-artifact@v4
        with:
          name: PalGateCar-TEST-no-actuation
          path: PalGateCar.apk

      - name: Build empty-gates TEST variant (empty-state render proof only)
        env:
          ECJ_JAR: ${{ github.workspace }}/tools/ecj.jar
          TEST_BUILD: '1'
          EMPTY_GATES: '1'
        run: |
          cp PalGateCar.apk /tmp/PalGateCar.standard.apk
          ./build.sh
          mv PalGateCar.apk PalGateCar-TEST-empty.apk
          # build.sh rm -rf's out/ and overwrites PalGateCar.apk; restore the
          # standard TEST apk for downstream steps (aa_test.sh installs it).
          cp /tmp/PalGateCar.standard.apk PalGateCar.apk

      - name: Upload empty-gates TEST APK (TEST BUILD, empty-state proof only)
        uses: actions/upload-artifact@v4
        with:
          name: PalGateCar-TEST-empty-no-actuation
          path: PalGateCar-TEST-empty.apk
          if-no-files-found: error

      - name: Build WidgetHostTest.apk (widget hosted-render harness)
        env:
          ECJ_JAR: ${{ github.workspace }}/tools/ecj.jar
        run: ./widgethost/build_host.sh

      - name: Download Open Headunit 3.5.0 (sha256 pinned)
        run: |
          curl -sSL -o open-headunit.apk https://github.com/andreknieriem/open-headunit/releases/download/v.3.5.0/com.andrerinas.headunitrevived_3.5.0.apk
          echo "609ca23b4eb0deaad2a58f6463b26cbf58bdc602ac0775eb5e7adb293a75a14d  open-headunit.apk" | sha256sum -c -

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android Auto + widget tests
        env:
          RUN_DHU: ${{ (contains(github.event.head_commit.message, '[dhu-run]') || github.event_name == 'workflow_dispatch') && '1' || '0' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 34 Play image: ships a modern Android Auto (gearhead) whose
          # protocol matches the DHU; the API 30 image's AA 5.3 failed the
          # DHU link auth (protocol 1.5 vs 1.7).
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 3072
          script: ./ci/aa_test.sh

      - name: Scan artifact staging for secrets before upload
        if: always()
        run: |
          if [ -d artifacts ]; then python3 ci/scan_secrets.py --dir artifacts; fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aa-widget-artifacts
          path: artifacts/
          if-no-files-found: warn

  # Third-party CAL host lane: AARE (pinned rev, public, GPLv3). NOT stock AA
  # proof - AARE and Google's stack reject each other's certificates both
  # directions, so this can never substitute for a gearhead projection pass.
  # Isolation: contents:read token, no secrets, no private fixtures; AARE is
  # cloned from its public repo at a pinned, reviewed commit.
  # Two-job split: the phone side runs in a pinned redroid Android 15 arm64
  # container (Google emulator images wedge the AARE phone-side encoder on
  # API 34 and API 36: zero encoded frames reach the head unit; redroid ships
  # its own AOSP codec build, a genuinely different stack to test).
  aare-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build-and-test
    permissions:
      contents: read
    env:
      AARE_REV: 74271014a4b8e94308e102f977ef180083001d10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK components
        run: |
          # AARE needs compileSdk 37; the runner's bundled cmdline-tools may be
          # too old to know it, so refresh cmdline-tools first, then install.
          SM0="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SM0" --install "cmdline-tools;latest" --sdk_root="$ANDROID_HOME" >/dev/null
          SM=$(ls -d "$ANDROID_HOME"/cmdline-tools/latest*/bin/sdkmanager | sort -V | tail -1)
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses >/dev/null || true
          BT=$("$SM" --list | grep -oE 'build-tools;[0-9.]+' | sort -t';' -k2 -V | tail -1)
          echo "newest build-tools: $BT"
          "$SM" "platforms;android-34" "$BT" "platform-tools"
          yes | "$SM" --channel=3 "platforms;android-37.2"

      - name: Clone AARE at pinned reviewed revision
        run: |
          git clone https://github.com/prototux/AARE "$HOME/aare"
          cd "$HOME/aare"
          git checkout "$AARE_REV"
          test "$(git rev-parse HEAD)" = "$AARE_REV"

      - name: Build AARE debug APK + desktop head unit (pinned source)
        run: cd "$HOME/aare" && ./gradlew --no-daemon :app:assembleDebug :headunit:installDist --console=plain -q

      - name: Build EncoderProbe.apk (standalone synthetic encoder diagnostic)
        env:
          ECJ_JAR: ${{ github.workspace }}/tools/ecj.jar
        run: ./encoderprobe/build_probe.sh

      - name: Download PalGateCar TEST apk
        uses: actions/download-artifact@v4
        with:
          name: PalGateCar-TEST-no-actuation

      - name: Stage + upload AARE build outputs
        run: |
          mkdir -p stage/headunit
          cp "$HOME/aare/app/build/outputs/apk/debug/app-debug.apk" stage/aare-app-debug.apk
          cp encoderprobe/EncoderProbe.apk stage/EncoderProbe.apk
          cp PalGateCar.apk stage/PalGateCar.apk
          cp -r "$HOME/aare/headunit/build/install/aare-headunit" stage/headunit/
          sha256sum stage/aare-app-debug.apk stage/PalGateCar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: aare-build-artifacts
          path: stage/
          if-no-files-found: error

  aare-host-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    needs: aare-build
    permissions:
      contents: read
    env:
      # Same pinned redroid image as the proven boot probe: Android 15 arm64,
      # dated immutable tag + digest. A redroid container is AOSP without GMS
      # / gearhead: a pass here is an Android-15-container result only, never
      # Android 16 / stock AA / GMS proof.
      REDROID_IMAGE: redroid/redroid:15.0.0_64only-250627@sha256:dc2024a999dd0acb1112a23cddc9537ec8cb60a0dbe5a87ce9fbd75a2f5e94d2
      ANDROID_SERIAL: localhost:5555
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Kernel binder setup (ephemeral runner)
        run: |
          sudo modprobe binder_linux devices=binder,hwbinder,vndbinder
          sudo modprobe loop || true
          sudo mkdir -p /dev/binderfs
          sudo mount -t binder binder /dev/binderfs
          ls -la /dev/binderfs/

      - name: Pull pinned redroid image and validate config BEFORE privileged execution
        run: |
          docker pull "$REDROID_IMAGE"
          docker image inspect "$REDROID_IMAGE" --format 'digests={{.RepoDigests}}'
          EP=$(docker image inspect "$REDROID_IMAGE" --format '{{json .Config.Entrypoint}}{{json .Config.Cmd}}')
          echo "entrypoint/cmd: $EP"
          echo "$EP" | grep -q '/init' || { echo "UNEXPECTED image entrypoint - aborting"; exit 1; }

      - name: Install native aarch64 adb client
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq adb || sudo apt-get install -y -qq android-tools-adb
          adb version | head -1

      - name: Download AARE build outputs
        uses: actions/download-artifact@v4
        with:
          name: aare-build-artifacts

      - name: Download empty-gates TEST apk (render proof phase A)
        uses: actions/download-artifact@v4
        with:
          name: PalGateCar-TEST-empty-no-actuation

      - name: Install headunit runtime deps (ffmpeg 8 static arm64, pinned + hash-verified)
        run: |
          # Same immutable BtbN autobuild tag as the x86 lane, arm64 asset.
          # sha256 computed locally over the full archive (size-verified).
          curl -sSL -o /tmp/ffmpeg.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-01-12-49/ffmpeg-n8.1.3-29-gad3b795b72-linuxarm64-gpl-8.1.tar.xz"
          echo "05a34a02b73083f9a1be7a7948e08a4d6c2477408a6a753790695bcd9b61abd7  /tmp/ffmpeg.tar.xz" | sha256sum -c -
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
          sudo install -m 755 /tmp/ffmpeg-n8.1.3-29-gad3b795b72-linuxarm64-gpl-8.1/bin/ffmpeg /usr/local/bin/ffmpeg
          ffmpeg -version | head -1

      - name: "Boot redroid container (bounded; proven recipe)"
        run: |
          docker run -d --name redroid --privileged \
            -v /dev/binderfs:/dev/binderfs \
            -p 5555:5555 \
            "$REDROID_IMAGE" \
            androidboot.redroid_gpu_mode=guest \
            androidboot.use_memfd=1 \
            androidboot.redroid_width=720 androidboot.redroid_height=1280 androidboot.redroid_dpi=320
          sleep 10
          docker ps --filter name=redroid --format '{{.Status}}'
          for i in $(seq 1 12); do
            adb connect localhost:5555 && break
            sleep 5
          done
          BC=""
          for i in $(seq 1 90); do
            docker ps --filter name=redroid --format '{{.Status}}' | grep -q Up || { echo "CONTAINER EXITED"; break; }
            BC=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$BC" = "1" ] && break
            sleep 5
          done
          if [ "$BC" != "1" ]; then
            echo "BOOT TIMEOUT"
            docker logs redroid 2>&1 | tail -40
            exit 1
          fi
          adb -s localhost:5555 shell getprop ro.build.version.release
          adb -s localhost:5555 shell getprop ro.product.cpu.abi

      # HELD 2026-11-02 (parent direction): encode wedge lane + encoder probe.
      # The zero-frame wedge is consolidated across every stack tried; no more
      # encoder CI launches until the hold is lifted. Steps kept for resume.
      - name: "HELD: AARE encode lane (wedge consolidated; hold 2026-11-02)"
        if: false
        run: AARE_DIR="$PWD" AARE_LAYOUT=dist bash ./ci/aare_test.sh

      - name: "HELD: encoder probe on redroid (hold 2026-11-02)"
        if: false
        run: bash ./ci/encoder_probe.sh

      # Authorized bounded lane: encoder-free launcher/local-preview render
      # proof of the PalGate template through AARE's local car runtime.
      - name: PalGate launcher/local-preview render proof (AARE, third-party host)
        run: AARE_DIR="$PWD" AARE_LAYOUT=dist bash ./ci/palgate_render.sh

      - name: Scan artifact staging for secrets before upload
        if: always()
        run: |
          if [ -d artifacts ]; then python3 ci/scan_secrets.py --dir artifacts; fi

      - name: Upload AARE lane artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aare-host-artifacts
          path: artifacts/
          if-no-files-found: warn

  # Same standalone probe on the Google emulator image where the AARE wedge is
  # fully documented (API 34): discriminates codec-stack vs AARE-app behavior
  # with guaranteed-animated synthetic input. Synthetic content only.
  # HELD 2026-11-02 (parent direction): no more encoder CI launches.
  encoder-probe-x86:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: aare-build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download AARE build outputs
        uses: actions/download-artifact@v4
        with:
          name: aare-build-artifacts

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run encoder probe (API 34 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 3072
          script: bash ./ci/encoder_probe.sh

      - name: Scan artifact staging for secrets before upload
        if: always()
        run: |
          if [ -d artifacts ]; then python3 ci/scan_secrets.py --dir artifacts; fi

      - name: Upload encoder probe artifacts (x86 API 34)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encoder-probe-artifacts-x86
          path: artifacts/
          if-no-files-found: warn
