name: redroid-capability-probe
# Bounded redroid probe for the user's native-ARM-Android-in-CI question.
# Authorization scope (parent, 2026-11-02 10:51): ONE bounded boot probe on
# ubuntu-24.04-arm; pinned reviewed arm64 image by digest; no secrets, no write
# credentials, no private fixtures, no untrusted repo code under privilege;
# synthetic TEST-marker APK only (actuation disabled); limited time/resources;
# proof required: binderfs mount, privileged docker policy, boot, adb, install,
# screencap pixels. An unmodified redroid container is AOSP without GMS /
# gearhead: it does not prove stock Android Auto projection; what adding those
# components would require is unexplored.
on: [push]

env:
  # Pinned official redroid image (remote-android/redroid-doc -> Docker Hub
  # redroid/redroid), Android 16 64-only, dated immutable tag, arm64 digest
  # fetched from the Docker Hub API on 2026-11-02.
  REDROID_IMAGE: redroid/redroid:16.0.0_64only-250627@sha256:e194edc99aa364358d1f8c214acb18b6d006c74fa0561f39259a20173ec30b66

jobs:
  boot:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Kernel binder setup (ephemeral runner; the mount under test)
        run: |
          set -x
          sudo modprobe binder_linux devices=binder,hwbinder,vndbinder
          sudo modprobe loop || true
          sudo mkdir -p /dev/binderfs
          sudo mount -t binder binder /dev/binderfs
          ls -la /dev/binderfs/
          grep -w binder /proc/filesystems

      - name: Pull pinned image and validate config BEFORE privileged execution
        run: |
          set -x
          docker pull "$REDROID_IMAGE"
          docker image inspect "$REDROID_IMAGE" --format 'digests={{.RepoDigests}}'
          EP=$(docker image inspect "$REDROID_IMAGE" --format '{{json .Config.Entrypoint}}{{json .Config.Cmd}}')
          echo "entrypoint/cmd: $EP"
          echo "$EP" | grep -q '/init' || { echo "UNEXPECTED image entrypoint - aborting"; exit 1; }
          docker image inspect "$REDROID_IMAGE" --format 'user={{.Config.User}} env={{json .Config.Env}} exposed={{json .Config.ExposedPorts}}'

      - name: Install native aarch64 adb client
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq adb || sudo apt-get install -y -qq android-tools-adb
          adb version | head -1

      - name: Fetch synthetic TEST APK from latest green palgate-ci run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          # Trust gate: newest non-expired artifact with this name ONLY from a
          # ci.yml run on this branch in this repository - never a fork/PR or
          # an arbitrary newest upload.
          REPO_ID=$(gh api repos/Chaim12345/palgate-ci-tests -q .id)
          gh api "repos/Chaim12345/palgate-ci-tests/actions/artifacts?per_page=20&name=PalGateCar-TEST-no-actuation" > /tmp/arts.json
          ROW=$(jq -r --arg rid "$REPO_ID" '.artifacts[] | select(.expired == false and (.workflow_run.head_repository_id|tostring) == $rid and .workflow_run.head_branch == "ci/dhu-widget-host") | [.id, .workflow_run.id, .workflow_run.head_sha] | @tsv' /tmp/arts.json | head -1)
          AID=$(echo "$ROW" | cut -f1); WRID=$(echo "$ROW" | cut -f2); SHA=$(echo "$ROW" | cut -f3)
          echo "artifact=$AID run=$WRID commit=$SHA"
          [ -n "$AID" ] || { echo "no trusted TEST APK artifact found"; exit 1; }
          WPATH=$(gh api "repos/Chaim12345/palgate-ci-tests/actions/runs/$WRID" -q .path)
          [ "$WPATH" = ".github/workflows/ci.yml" ] || { echo "artifact from untrusted workflow: $WPATH"; exit 1; }
          gh api "repos/Chaim12345/palgate-ci-tests/commits/$SHA" -q .sha | grep -q "$SHA" || { echo "source commit not in repo"; exit 1; }
          echo "trust gate passed: ci.yml run $WRID at $SHA"
          mkdir -p apk
          gh api "repos/Chaim12345/palgate-ci-tests/actions/artifacts/$AID/zip" > apk/apk.zip
          cd apk && unzip -o apk.zip && rm apk.zip && cd ..
          ls -la apk/
          sha256sum apk/PalGateCar.apk
          # No-actuation guarantee: the test marker must be inside the APK.
          unzip -l apk/PalGateCar.apk | grep -q 'assets/test_build.marker' && echo "TEST MARKER PRESENT - actuation disabled build"

      - name: "Boot redroid container (bounded 2 CPU / 4G / 15min job cap)"
        run: |
          set -x
          docker run -d --name redroid --privileged \
            -v /dev/binderfs:/dev/binderfs \
            -p 5555:5555 \
            "$REDROID_IMAGE" \
            androidboot.redroid_gpu_mode=guest \
            androidboot.use_memfd=1 \
            androidboot.redroid_width=720 androidboot.redroid_height=1280 androidboot.redroid_dpi=320
          sleep 10
          docker ps --filter name=redroid --format '{{.Status}}'
          for i in $(seq 1 12); do
            adb connect localhost:5555 && break
            sleep 5
          done
          mkdir -p artifacts
          for i in $(seq 1 90); do
            docker ps --filter name=redroid --format '{{.Status}}' | grep -q Up || { echo "CONTAINER EXITED"; break; }
            BC=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            ANIM=$(adb -s localhost:5555 shell getprop init.svc.bootanim 2>/dev/null | tr -d '\r')
            echo "boot poll $i: boot_completed=$BC bootanim=$ANIM"
            [ "$BC" = "1" ] && break
            sleep 5
          done
          if [ "$BC" != "1" ]; then
            echo "BOOT TIMEOUT - collecting diagnostics"
            {
              echo "== container state =="; docker inspect redroid --format '{{json .State}}' 2>&1
              echo "== docker logs =="; docker logs redroid 2>&1 | tail -40
              echo "== getprop sample =="; adb -s localhost:5555 shell getprop 2>&1 | head -30
              echo "== processes =="; adb -s localhost:5555 shell ps -A 2>&1 | head -30
              echo "== crash buffer =="; adb -s localhost:5555 logcat -d -b crash 2>&1 | tail -60
              echo "== key services =="; adb -s localhost:5555 shell 'getprop | grep -E "init.svc.(zygote|surfaceflinger|system)|sys.boot_completed|ro.product.cpu.abi|ro.build.version.release"' 2>&1
              echo "== fatal lines =="; adb -s localhost:5555 logcat -d 2>&1 | grep -iE 'FATAL|Watchdog|system_server|SurfaceFlinger|zygote|lowmemorykiller|sigsegv|sigabrt' | tail -40
              echo "== logcat tail =="; adb -s localhost:5555 logcat -d -b all 2>&1 | tail -80
              echo "== dmesg tail =="; adb -s localhost:5555 shell dmesg 2>&1 | tail -40
            } > artifacts/boot_diag.txt 2>&1 || true
            cat artifacts/boot_diag.txt | head -100
            exit 1
          fi
          adb -s localhost:5555 shell getprop ro.build.version.release
          adb -s localhost:5555 shell getprop ro.product.cpu.abi

      - name: Install TEST APK and capture actual pixels
        run: |
          set -x
          adb -s localhost:5555 install -r apk/PalGateCar.apk
          adb -s localhost:5555 shell pm list packages | grep -i palgate || echo "palgate package NOT listed"
          mkdir -p artifacts
          adb -s localhost:5555 exec-out screencap -p > artifacts/redroid_boot.png
          file artifacts/redroid_boot.png
          ls -la artifacts/

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redroid-boot-artifacts
          path: artifacts/
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          docker rm -f redroid || true
          sudo umount /dev/binderfs || true
